name: Issue Auto Handler

on:
  issues:
    types: [opened, labeled]

permissions:
  issues: write

jobs:
  # Job 1: Auto-reply when a new issue is opened
  auto-reply:
    if: github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - name: Post welcome comment
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.issue.number;
            const author = context.payload.issue.user.login;

            const body = [
              `👋 你好 @${author}，感谢你提交这个 Issue！`,
              '',
              '我们已收到你的反馈，会尽快查看。在此之前，请确认以下信息以帮助我们更快地定位问题：',
              '',
              '- **环境信息**：操作系统、浏览器版本、相关工具版本等',
              '- **复现步骤**：如何稳定触发该问题',
              '- **期望行为 vs 实际行为**：你预期看到什么，实际发生了什么',
              '',
              '如果是功能建议，请描述你期望的使用场景和预期效果。',
              '',
              '> 🤖 此回复由自动化工作流生成。'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: body
            });

  # Job 2: Assign to Copilot coding agent when bug label is added
  assign-copilot-on-bug:
    if: github.event.action == 'labeled' && github.event.label.name == 'bug'
    runs-on: ubuntu-latest
    steps:
      - name: Assign issue to Copilot coding agent
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            console.log(`Bug label added to issue #${issueNumber}, assigning to Copilot coding agent...`);

            try {
              // Use the correct Copilot coding agent assignee and agent_assignment flag
              const response = await github.request(
                'POST /repos/{owner}/{repo}/issues/{issue_number}/assignees',
                {
                  owner,
                  repo,
                  issue_number: issueNumber,
                  assignees: ['copilot-swe-agent[bot]'],
                  agent_assignment: true
                }
              );

              // Verify that Copilot was actually assigned by checking the response
              const assignees = (response.data.assignees || []).map(a => a.login);
              if (!assignees.includes('copilot-swe-agent')) {
                throw new Error('Copilot coding agent was not found in assignees after the API call');
              }

              console.log('Successfully assigned to Copilot coding agent.');

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: '🐛 已识别为 Bug，已成功分配给 Copilot coding agent 处理。Copilot 将自动分析问题并尝试开 PR 修复。\n\n> 🤖 此回复由自动化工作流生成。'
              });
            } catch (error) {
              const errMsg = String(error.message).replace(/[`$\\]/g, '');
              console.error(`Failed to assign Copilot coding agent: ${errMsg}`);

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: `⚠️ 尝试将此 Issue 分配给 Copilot coding agent 失败：\n\n\`${errMsg}\`\n\n请检查仓库是否已启用 Copilot coding agent，或手动分配。\n\n> 🤖 此回复由自动化工作流生成。`
              });
            }
